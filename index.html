<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>〇〇 〇〇 | プロフィール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f8f3e6;
    --paper-card: #fbf7ec;
    --paper-deep: #ece1c8;
    --ink: #24231f;
    --ink-soft: #736c5a;
    --seal: #b83c22;
    --seal-deep: #8e2c17;
    --indigo: #33506e;
    --hairline: rgba(36, 35, 31, 0.18);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--paper);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--ink);
    padding: clamp(24px, 6vw, 56px) 16px;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(circle at 1px 1px, rgba(36, 35, 31, 0.05) 1px, transparent 0);
    background-size: 3px 3px;
    opacity: 0.6;
  }

  .card {
    position: relative;
    display: flex;
    max-width: 560px;
    width: 100%;
    background: var(--paper-card);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    box-shadow: 0 40px 70px -32px rgba(36, 35, 31, 0.35), 0 2px 0 rgba(255, 255, 255, 0.5) inset;
  }

  .label-strip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 6px;
    border-right: 1px solid var(--hairline);
  }

  .label-strip span {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 13px;
    letter-spacing: 0.4em;
    color: var(--ink-soft);
  }

  .content {
    flex: 1 1 auto;
    min-width: 0;
    padding: clamp(32px, 6vw, 48px) clamp(24px, 6vw, 40px);
    text-align: center;
  }

  .avatar-wrap {
    position: relative;
    width: 108px;
    height: 108px;
    margin: 0 auto 18px;
  }

  .avatar-wrap svg {
    width: 100%;
    height: 100%;
  }

  .avatar-ring {
    fill: none;
    stroke: var(--ink);
    stroke-linecap: round;
    stroke-dasharray: 255 40;
    stroke-dashoffset: 0;
  }

  .avatar-ring--soft {
    stroke: var(--seal);
    opacity: 0.55;
  }

  .avatar-mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 34px;
    color: var(--ink);
  }

  h1 {
    margin: 4px 0 2px;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 800;
    font-size: clamp(24px, 5vw, 30px);
    letter-spacing: 0.06em;
  }

  .job {
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 0.12em;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--hairline);
    margin: 20px auto 24px;
  }

  .section {
    text-align: left;
    margin-bottom: 22px;
  }

  .section-title {
    font-size: 12px;
    color: var(--seal);
    font-weight: 700;
    letter-spacing: 0.18em;
    margin-bottom: 10px;
  }

  .likes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .likes span {
    border: 1px solid var(--hairline);
    color: var(--ink);
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.04em;
    background: var(--paper);
  }

  .message {
    position: relative;
    margin: 30px 0 28px;
    padding: 24px 26px;
    border: 1px solid var(--hairline);
    border-radius: 2px;
    background: var(--paper);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.7;
    text-align: left;
  }

  .seal {
    position: absolute;
    top: -18px;
    right: -14px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--seal);
    color: var(--paper-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 22px;
    font-weight: 800;
    box-shadow: 0 6px 14px -4px rgba(142, 44, 23, 0.55);
    transform: rotate(-9deg);
    border: 2px solid var(--seal-deep);
  }

  .sns {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--paper);
    background: var(--ink);
    padding: 11px 26px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: background 0.25s ease;
  }

  .sns:hover {
    background: var(--seal-deep);
  }

  .sns:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--indigo);
    outline-offset: 3px;
  }

  @media (max-width: 420px) {
    .label-strip {
      padding: 20px 4px;
    }

    .label-strip span {
      font-size: 11px;
      letter-spacing: 0.3em;
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    .avatar-ring {
      stroke-dasharray: 255 40;
      stroke-dashoffset: 295;
      animation: draw 1.1s ease-out 0.15s forwards;
    }

    .avatar-ring--soft {
      animation-delay: 0.3s;
    }

    .content > * {
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.6s ease-out forwards;
    }

    h1 { animation-delay: 0.55s; }
    .job { animation-delay: 0.62s; }
    .divider { animation-delay: 0.68s; }
    .section { animation-delay: 0.74s; }
    .message { animation-delay: 0.82s; }
    .sns { animation-delay: 0.95s; }

    .seal {
      opacity: 0;
      transform: rotate(-9deg) scale(1.6);
      animation: stamp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 1.15s forwards;
    }
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes stamp {
    to { opacity: 1; transform: rotate(-9deg) scale(1); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="label-strip"><span>プロフィール</span></div>
    <div class="content">
      <div class="avatar-wrap">
        <svg viewBox="0 0 120 120">
          <circle class="avatar-ring avatar-ring--soft" cx="61" cy="62" r="46" stroke-width="4" transform="rotate(-96 61 62)"/>
          <circle class="avatar-ring" cx="60" cy="60" r="46" stroke-width="3" transform="rotate(-100 60 60)"/>
        </svg>
        <div class="avatar-mark">〇</div>
      </div>
      <h1>〇〇 〇〇</h1>
      <div class="job">△△</div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-title">好きなこと</div>
        <div class="likes">
          <span>〇〇</span>
          <span>△△</span>
          <span>□□</span>
        </div>
      </div>

      <div class="message">
        「AIで仕事を変えたい」
        <div class="seal">誓</div>
      </div>

      <a class="sns" href="https://x.com/" target="_blank" rel="noopener noreferrer">X で見る</a>
    </div>
  </div>
</body>
</html>
