<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単位コンバーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: #0b0c0e;
    --casing: #18191b;
    --rail: #48494c;
    --flap-top: #2a2c2f;
    --flap: #232527;
    --flap-bottom: #1c1e20;
    --crease: #050506;
    --text: #f3ead9;
    --amber: #e2a33f;
    --amber-dim: rgba(226, 163, 63, 0.55);
    --focus: #f4c26b;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse 70% 55% at 50% 32%, #202226 0%, var(--stage) 70%);
    font-family: "Barlow Condensed", "Noto Sans JP", sans-serif;
    color: var(--text);
    padding: 32px 16px;
  }

  .board {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--casing);
    border-radius: 10px;
    padding: 26px 26px 30px;
    box-shadow:
      0 40px 80px -30px rgba(0, 0, 0, 0.8),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset;
  }

  .board::before,
  .board::after,
  .rivet-l,
  .rivet-r {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #5a5c60, #0c0d0e 75%);
  }

  .board::before { top: 12px; left: 12px; }
  .board::after { top: 12px; right: 12px; }
  .rivet-l { bottom: 12px; left: 12px; }
  .rivet-r { bottom: 12px; right: 12px; }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text);
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--amber);
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 6px 1px var(--amber-dim);
  }

  .field {
    margin-bottom: 20px;
  }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: #8b8d90;
    margin-bottom: 8px;
  }

  .plate {
    position: relative;
    background: linear-gradient(to bottom, var(--flap-top), var(--flap) 50%, var(--flap-bottom));
    border-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.5);
  }

  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: none;
    color: var(--text);
    font: inherit;
    font-family: "Barlow Condensed", "Noto Sans JP", sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.02em;
    padding: 13px 40px 13px 14px;
    background-image: linear-gradient(45deg, transparent 50%, var(--amber) 50%), linear-gradient(135deg, var(--amber) 50%, transparent 50%);
    background-position: calc(100% - 20px) center, calc(100% - 15px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  select option {
    background: var(--casing);
    color: var(--text);
  }

  .input-row {
    display: flex;
    align-items: stretch;
    gap: 10px;
  }

  .input-row .plate {
    flex: 1 1 auto;
    min-width: 0;
  }

  input[type="number"] {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 20px;
    padding: 13px 14px;
    font-variant-numeric: tabular-nums;
  }

  input[type="number"]::placeholder {
    color: #5c5e61;
  }

  .unit-plate {
    flex: 0 0 auto;
    min-width: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 16px;
    color: var(--amber);
    border: 1px solid rgba(226, 163, 63, 0.35);
    border-radius: 6px;
    background: rgba(226, 163, 63, 0.06);
  }

  select:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .arrow-divider {
    text-align: center;
    color: #55575a;
    font-size: 13px;
    letter-spacing: 0.4em;
    margin: -6px 0 16px;
  }

  .result-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .flap-board {
    display: flex;
    gap: 4px;
    perspective: 400px;
  }

  .flap {
    position: relative;
    width: 30px;
    height: 48px;
    border-radius: 4px;
    background: linear-gradient(to bottom, var(--flap-top), var(--flap) 50%, var(--flap-bottom));
    border: 1px solid rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 26px;
    color: var(--text);
    transform-style: preserve-3d;
    overflow: hidden;
  }

  .flap.is-sign,
  .flap.is-dot {
    width: 18px;
    font-size: 22px;
  }

  .flap::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: var(--crease);
    transform: translateY(-0.5px);
  }

  .flap-unit {
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 14px;
    color: var(--amber);
    white-space: nowrap;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: no-preference) {
    .flap {
      animation: flap-in 0.4s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }
  }

  @keyframes flap-in {
    0% { transform: rotateX(-100deg); opacity: 0.3; }
    55% { transform: rotateX(12deg); opacity: 1; }
    100% { transform: rotateX(0deg); opacity: 1; }
  }

  @media (max-width: 380px) {
    .flap { width: 24px; height: 40px; font-size: 21px; }
    .flap.is-sign, .flap.is-dot { width: 14px; font-size: 18px; }
  }
</style>
</head>
<body>
  <main class="board">
    <div class="header">
      <h1>単位コンバーター</h1>
      <span class="live"><span class="live-dot" aria-hidden="true"></span>LIVE</span>
    </div>

    <div class="field">
      <label class="field-label" for="type">変換タイプ</label>
      <div class="plate">
        <select id="type">
          <option value="kg2lb">kg → lb（キログラム→ポンド）</option>
          <option value="lb2kg">lb → kg（ポンド→キログラム）</option>
          <option value="cm2in">cm → inch（センチ→インチ）</option>
          <option value="in2cm">inch → cm（インチ→センチ）</option>
          <option value="c2f">℃ → ℉（摂氏→華氏）</option>
          <option value="f2c">℉ → ℃（華氏→摂氏）</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="inputValue">入力値</label>
      <div class="input-row">
        <div class="plate">
          <input type="number" id="inputValue" inputmode="decimal" placeholder="0" step="any">
        </div>
        <span class="unit-plate" id="inputUnit">kg</span>
      </div>
    </div>

    <div class="arrow-divider">▾ ▾ ▾</div>

    <div class="field" style="margin-bottom: 0;">
      <label class="field-label" id="resultLabel">変換結果</label>
      <div class="result-row">
        <div class="flap-board" id="output" aria-hidden="true"></div>
        <span class="flap-unit" id="outputUnit">lb</span>
      </div>
      <span class="sr-only" role="status" aria-live="polite" id="outputSr"></span>
    </div>

    <span class="rivet-l" aria-hidden="true"></span>
    <span class="rivet-r" aria-hidden="true"></span>
  </main>

  <script>
    const CONVERSIONS = {
      kg2lb: { from: "kg", to: "lb", fn: v => v * 2.2046226218 },
      lb2kg: { from: "lb", to: "kg", fn: v => v / 2.2046226218 },
      cm2in: { from: "cm", to: "inch", fn: v => v / 2.54 },
      in2cm: { from: "inch", to: "cm", fn: v => v * 2.54 },
      c2f:   { from: "℃", to: "℉", fn: v => (v * 9) / 5 + 32 },
      f2c:   { from: "℉", to: "℃", fn: v => ((v - 32) * 5) / 9 },
    };

    const typeSelect = document.getElementById("type");
    const inputEl = document.getElementById("inputValue");
    const inputUnitEl = document.getElementById("inputUnit");
    const flapBoard = document.getElementById("output");
    const outputUnitEl = document.getElementById("outputUnit");
    const outputSr = document.getElementById("outputSr");

    function renderFlaps(str) {
      flapBoard.innerHTML = "";
      [...str].forEach((ch, i) => {
        const flap = document.createElement("div");
        flap.className = "flap";
        if (ch === "-") flap.classList.add("is-sign");
        if (ch === ".") flap.classList.add("is-dot");
        flap.style.animationDelay = `${i * 35}ms`;
        flap.textContent = ch;
        flapBoard.appendChild(flap);
      });
    }

    function update() {
      const conv = CONVERSIONS[typeSelect.value];
      inputUnitEl.textContent = conv.from;
      outputUnitEl.textContent = conv.to;

      const num = parseFloat(inputEl.value);
      const text = Number.isNaN(num) ? "—" : conv.fn(num).toFixed(2);
      renderFlaps(text);
      outputSr.textContent = Number.isNaN(num) ? "" : `${text} ${conv.to}`;
    }

    typeSelect.addEventListener("change", update);
    inputEl.addEventListener("input", update);
    update();
  </script>
</body>
</html>
